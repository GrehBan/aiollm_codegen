name: checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: aiollm_codegen
    steps:
      - uses: actions/checkout@v7
        with:
          path: aiollm_codegen
      - uses: actions/checkout@v7
        with:
          repository: aiollm-org/aiollm
          ref: d2f110956bb0168e3e655f83390f5136f56d3590
          path: aiollm
      # The providers' contract snapshots, which the generated models are
      # checked against (tests/test_provider_contracts.py).
      - uses: actions/checkout@v7
        with:
          repository: aiollm-org/aiollm_openai
          ref: 8afd88f67664cb6531794fdcf827c74c80df8a40
          path: aiollm_openai
      - uses: actions/checkout@v7
        with:
          repository: aiollm-org/aiollm_anthropic
          ref: 3d1b4ba7c848ea0c697d259d0ce1f2a773a84a47
          path: aiollm_anthropic
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.13'
      - run: uv sync --all-groups --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run mypy src
      - run: uv run pyright
      - run: uv run pytest --mypy -m mypy tests/typing
      - run: uv run pytest --cov --cov-branch
      - run: uv run rumdl check README.md AGENTS.md
      - run: uv lock --check
      - run: uv pip check
      - run: uv build
