# Synchronized with aiollm strict Ruff rules.

line-length = 79
target-version = "py313"
src = ["src"]
extend-exclude = [
    "build",
    "dist",
    "venv",
    ".venv",
    "docs",
    "dev",
    "scripts",
    "*.egg-info",
]


[lint]
select = [
    "C90", # mccabe: cyclomatic complexity, see [lint.mccabe]
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "D", # pydocstyle
    "DTZ", # flake8-datetimez
    "E", # pycodestyle errors
    "F", # pyflakes
    "G", # flake8-logging-format: lazy logging arguments
    "I", # isort
    "LOG", # flake8-logging
    "PERF", # perflint
    "PL", # pylint
    "Q", # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "UP", # pyupgrade
]
ignore = [
    "A002",
    "A005",
    "B008",
    "PLC0415",
    "PLC1901",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR6301",
    "PLW2901",
    "PLW3201",
]

[lint.per-file-ignores]
"tests/**" = [
    "D", # docstrings are not required in tests
    "PLR2004", # magic values are expected in asserts
]

[lint.mccabe]
# mccabe's own default. Every "case" of a "match" counts as a branch, so a
# lower limit flags flat dispatchers (by format, by SSE field) that read
# well as they are; 10 catches functions that have really grown.
max-complexity = 10

[lint.pydocstyle]
convention = "google"

[lint.isort]
known-first-party = ["aiollm"]
required-imports = ["from __future__ import annotations"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

